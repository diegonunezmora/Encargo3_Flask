
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Cálculo de notas</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>Cálculo de notas</h1>

            <p class="subtitulo">
                Ingresa las tres notas y el porcentaje de asistencia para conocer el resultado.
            </p>

            <form method="POST">

                <div class="form-group">
                    <label for="nota1">Primera nota (10 a 70)</label>
                    <input type="number" id="nota1" name="nota1"
                           min="10" max="70" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="nota2">Segunda nota (10 a 70)</label>
                    <input type="number" id="nota2" name="nota2"
                           min="10" max="70" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="nota3">Tercera nota (10 a 70)</label>
                    <input type="number" id="nota3" name="nota3"
                           min="10" max="70" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="asistencia">Asistencia (0 a 100%)</label>
                    <input type="number" id="asistencia" name="asistencia"
                           min="0" max="100" step="0.1" required>
                </div>

                <button type="submit" class="btn">
                    Calcular resultado
                </button>

            </form>

            {% if resultado %}

            <div class="resultado">

                <h2>Resultado</h2>

                <p>Promedio: <strong>{{ resultado.promedio }}</strong></p>

                <p>Asistencia: <strong>{{ resultado.asistencia }}%</strong></p>

                <h3 class="{% if resultado.estado == 'Aprobado' %}aprobado{% else %}reprobado{% endif %}">
                    Estado: {{ resultado.estado }}
                </h3>

            </div>

            {% endif %}

            <div class="volver">
                <a href="/" class="volver">Volver al menú principal</a>
            </div>

        </div>
    </div>

</body>
</html>
