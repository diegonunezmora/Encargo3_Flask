
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}Aplicación Flask - Encargo 3{% endblock %}
    </title>

    <!-- Hoja de estilos principal -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Contenedor principal -->
    <main class="container">

        {% block contenido %}
        {% endblock %}

        <footer>
            <p style="text-align: center; margin-top: 30px;">
                Aplicación desarrollada con Python y Flask
            </p>
        </footer>

    </main>

</body>
</html>
